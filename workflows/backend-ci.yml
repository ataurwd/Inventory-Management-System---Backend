name: Backend CI

on: [push, pull_request]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    env:
      NODE_ENV: test
      MONGO_URI: mongodb://localhost:27017/test-db
      JWT_SECRET: testing_secret_jwt_key_at_least_16_characters
      JWT_REFRESH_SECRET: testing_refresh_secret_jwt_key_at_least_16_characters
      SMTP_SECURE: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Compile TypeScript
        run: npm run build

      - name: Run unit and integration tests
        run: npm test
